name: Deploy Film Studio Worker

on:
  workflow_run:
    workflows: ["Film Studio CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      verified_sha:
        description: "Exact Film Studio commit SHA to redeploy. It must already have a successful Film Studio CI run and belong to main."
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: filmstudio-worker-production
  cancel-in-progress: false

env:
  WORKERS_URL: https://parkkey-filmcraft-studio.parkkey-coreos-nordic-2026.workers.dev

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.verified_sha }}
    steps:
      - name: Checkout exact verified Film Studio commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify deployment provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || {
            echo "::error::Checkout ${actual} does not match requested verified SHA ${TARGET_SHA}"
            exit 1
          }

          git fetch origin main --quiet
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "::error::Film Studio SHA ${TARGET_SHA} is not contained in main. Refusing production deploy."
            exit 1
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" > /tmp/filmstudio-runs.json
            jq -e --arg sha "$TARGET_SHA" '
              .workflow_runs
              | any(.name == "Film Studio CI" and .head_sha == $sha and .conclusion == "success")
            ' /tmp/filmstudio-runs.json >/dev/null || {
              echo "::error::Manual deploy refused: no successful Film Studio CI run exists for ${TARGET_SHA}."
              exit 1
            }
          fi

          echo "FILM_STUDIO_SHA=${TARGET_SHA}" >> "$GITHUB_ENV"
          echo "Production provenance verified for Film Studio ${TARGET_SHA}."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Film Studio for Cloudflare
        env:
          VITE_SUPABASE_URL: https://xoabfpxdqqlutxwjgqii.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Y1afZYB-ULMMdB_5y-21Aw_LYQxqFxl
          VITE_FILM_STUDIO_SHA: ${{ env.FILM_STUDIO_SHA }}
          SUPABASE_URL: https://xoabfpxdqqlutxwjgqii.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_Y1afZYB-ULMMdB_5y-21Aw_LYQxqFxl
        run: bun run build

      - name: Verify Cloudflare build output
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/server/wrangler.json
          test -d .output/public
          grep -R -Fq "${FILM_STUDIO_SHA}" .output/public || {
            echo '::error::Build did not embed the Film Studio source SHA'
            exit 1
          }
          tmp="$(mktemp)"
          jq '.workers_dev = true | .routes = []' .output/server/wrangler.json > "$tmp"
          mv "$tmp" .output/server/wrangler.json

      - name: Detect direct deploy capability
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Direct Cloudflare deployment is enabled.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Direct Cloudflare deploy is ready but waiting for CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in this repository. parkkey-os remains the active deployment owner.'
          fi

      - name: Deploy production Worker
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@latest deploy
          --config .output/server/wrangler.json
          --name parkkey-filmcraft-studio
          --var SUPABASE_URL:https://xoabfpxdqqlutxwjgqii.supabase.co
          --var SUPABASE_PUBLISHABLE_KEY:sb_publishable_Y1afZYB-ULMMdB_5y-21Aw_LYQxqFxl
          --var FILM_STUDIO_SHA:${FILM_STUDIO_SHA}
          --var 'VIDEO_RENDER_ALLOWED_HOSTS:replicate.delivery,*.replicate.delivery'
          --var REPLICATE_VIDEO_MODEL:google/veo-2
          --var LINKEDIN_API_VERSION:202608

      - name: Sync available server-only integration secrets
        if: steps.cloudflare.outputs.enabled == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REDIRECT_URI: ${{ secrets.LINKEDIN_REDIRECT_URI }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: |
          set -euo pipefail
          payload="$(mktemp)"
          jq -n '{}' > "$payload"
          configured=0
          for name in LINKEDIN_ACCESS_TOKEN LINKEDIN_CLIENT_ID LINKEDIN_CLIENT_SECRET LINKEDIN_REDIRECT_URI REPLICATE_API_TOKEN LOVABLE_API_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              tmp="$(mktemp)"
              jq --arg key "$name" --arg value "$value" '. + {($key): $value}' "$payload" > "$tmp"
              mv "$tmp" "$payload"
              echo "${name}=CONFIGURED_IN_GITHUB"
              configured=$((configured + 1))
            else
              echo "${name}=NOT_STORED_IN_GITHUB"
            fi
          done
          if [ "$configured" -gt 0 ]; then
            npx --yes wrangler@latest secret bulk "$payload" --name parkkey-filmcraft-studio
          fi
          rm -f "$payload"

      - name: Verify Worker server-only integration secrets
        if: steps.cloudflare.outputs.enabled == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest secret list --name parkkey-filmcraft-studio > /tmp/filmstudio-secrets.json
          jq -r '.[].name' /tmp/filmstudio-secrets.json | sort > /tmp/filmstudio-secret-names.txt
          for name in LINKEDIN_ACCESS_TOKEN LINKEDIN_CLIENT_ID LINKEDIN_CLIENT_SECRET LINKEDIN_REDIRECT_URI REPLICATE_API_TOKEN LOVABLE_API_KEY; do
            if grep -Fxq "$name" /tmp/filmstudio-secret-names.txt; then
              echo "${name}=CONFIGURED_ON_WORKER"
            else
              echo "${name}=MISSING_ON_WORKER"
            fi
          done
          rm -f /tmp/filmstudio-secrets.json /tmp/filmstudio-secret-names.txt

      - name: E2E smoke production Worker
        if: steps.cloudflare.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for path in /auth /studio /studio/media /studio/linkedin /studio/integrations; do
            ok=0
            for attempt in $(seq 1 12); do
              status="$(curl --silent --show-error --max-redirs 0 --output /dev/null --write-out '%{http_code}' "${WORKERS_URL}${path}" || true)"
              echo "${WORKERS_URL}${path} -> HTTP ${status} (attempt ${attempt})"
              if [[ "$status" =~ ^(200|301|302|303|307|308)$ ]]; then
                ok=1
                break
              fi
              sleep 5
            done
            [[ "$ok" == "1" ]] || { echo "::error::Production smoke failed for ${path}"; exit 1; }
          done
          echo "Film Studio ${FILM_STUDIO_SHA} is live for CoreOS at ${WORKERS_URL}/studio"
