name: Film Studio CI

on:
  push:
    branches:
      - chore/tanstack-validator-modernization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Modernize deprecated TanStack validators
        if: github.event_name == 'push' && github.ref_name == 'chore/tanstack-validator-modernization'
        run: |
          find src/lib -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 sed -i 's/\.inputValidator(/.validator(/g'
          bunx prettier --write src/lib
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib
            git commit -m "chore: replace deprecated TanStack inputValidator API"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Generate routes and production build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
