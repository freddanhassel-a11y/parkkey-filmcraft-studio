name: Film Studio CI

on:
  push:
    branches:
      - feat/film-studio-production-phase-2-v2
      - feat/phase-2-production-workflow
      - feat/phase-3-delivery-proof-qa
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TanStack Router generates src/routeTree.gen.ts through the Vite plugin.
      # Build first so newly added file routes are present before tsc validates route types.
      - name: Generate routes and production build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
