name: Film Studio CI

on:
  push:
    branches:
      - feat/film-studio-production-phase-2-v2
      - feat/phase-2-production-workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format active Phase 2 sources
        if: github.event_name == 'push' && github.ref_name == 'feat/phase-2-production-workflow'
        run: |
          bunx prettier --write \
            src/lib/linkedin-capability.ts \
            src/lib/social.functions.ts \
            src/routes/_authenticated/studio/linkedin.tsx \
            'src/routes/_authenticated/studio/project.$id.tsx'
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/lib/linkedin-capability.ts \
              src/lib/social.functions.ts \
              src/routes/_authenticated/studio/linkedin.tsx \
              'src/routes/_authenticated/studio/project.$id.tsx'
            git commit -m "style: format Phase 2 sources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
