name: Temporary LinkedIn Gate Codemod

on:
  push:
    branches: [feat/linkedin-confirmed-publish]
    paths:
      - '.github/workflows/temporary-linkedin-gate-codemod.yml'

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/linkedin-confirmed-publish
      - name: Replace legacy verification button with explicit publish gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authenticated/studio/linkedin.tsx')
          text = path.read_text()
          text = text.replace('import { CalendarClock, Copy, Linkedin, Send, TriangleAlert } from "lucide-react";', 'import { CalendarClock, Copy, Linkedin, TriangleAlert } from "lucide-react";', 1)
          text = text.replace('  attemptPublish,\n', '', 1)
          text = text.replace('import { SectionHeading } from "@/components/studio/brand";\n', 'import { SectionHeading } from "@/components/studio/brand";\nimport { LinkedInPublishGate } from "@/components/studio/LinkedInPublishGate";\n', 1)
          text = text.replace('  const publish = useServerFn(attemptPublish);\n', '', 1)
          old = '''                  <Button
                    variant="outline"
                    onClick={() =>
                      void publish({ data: { post_id: selected.id } }).then(
                        (res) => {
                          toast.message(res.message);
                          void capability.refetch();
                          invalidate();
                        },
                        (err: unknown) =>
                          toast.error(
                            err instanceof Error ? err.message : "Försöket misslyckades.",
                          ),
                      )
                    }
                  >
                    <Send aria-hidden="true" />
                    Verifiera publiceringsförsök
                  </Button>'''
          new = '''                  <LinkedInPublishGate
                    postId={selected.id}
                    status={selected.status}
                    attachedCount={attachedIds.length}
                    onResult={() => {
                      void capability.refetch();
                      invalidate();
                    }}
                  />'''
          if old not in text:
              raise SystemExit('Expected legacy publish button not found; refusing broad edit')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit exact codemod
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/studio/linkedin.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat(linkedin): require explicit publish confirmation in UI'
          git push origin HEAD:feat/linkedin-confirmed-publish
