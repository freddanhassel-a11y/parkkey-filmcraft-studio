name: Temporary LinkedIn Gate Codemod

on:
  push:
    branches: [feat/linkedin-confirmed-publish]
    paths:
      - '.github/workflows/temporary-linkedin-gate-codemod.yml'

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/linkedin-confirmed-publish
      - name: Replace legacy verification button with explicit publish gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/_authenticated/studio/linkedin.tsx')
          text = path.read_text()
          marker = 'Verifiera publiceringsförsök'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected exactly one publish marker, got {text.count(marker)}')

          text = text.replace(
              'import { CalendarClock, Copy, Linkedin, Send, TriangleAlert } from "lucide-react";',
              'import { CalendarClock, Copy, Linkedin, TriangleAlert } from "lucide-react";',
              1,
          )
          text = text.replace('  attemptPublish,\n', '', 1)
          if 'LinkedInPublishGate' not in text:
              text = text.replace(
                  'import { SectionHeading } from "@/components/studio/brand";\n',
                  'import { SectionHeading } from "@/components/studio/brand";\nimport { LinkedInPublishGate } from "@/components/studio/LinkedInPublishGate";\n',
                  1,
              )
          text = text.replace('  const publish = useServerFn(attemptPublish);\n', '', 1)

          marker_pos = text.index(marker)
          start = text.rfind('<Button', 0, marker_pos)
          end_start = text.find('</Button>', marker_pos)
          if start == -1 or end_start == -1:
              raise SystemExit('Could not isolate legacy publish button')
          end = end_start + len('</Button>')
          old_block = text[start:end]
          if 'publish({ data: { post_id: selected.id } })' not in old_block:
              raise SystemExit('Marker belongs to an unexpected button; refusing edit')

          indent_start = text.rfind('\n', 0, start) + 1
          indent = text[indent_start:start]
          replacement = f'''<LinkedInPublishGate
          {{indent}}  postId={{selected.id}}
          {{indent}}  status={{selected.status}}
          {{indent}}  attachedCount={{attachedIds.length}}
          {{indent}}  onResult={{() => {{
          {{indent}}    void capability.refetch();
          {{indent}}    invalidate();
          {{indent}}  }}}}
          {{indent}}/>'''.replace('{indent}', indent)
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Commit exact codemod
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/studio/linkedin.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat(linkedin): require explicit publish confirmation in UI'
          git push origin HEAD:feat/linkedin-confirmed-publish
