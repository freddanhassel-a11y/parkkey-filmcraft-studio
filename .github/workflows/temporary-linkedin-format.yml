name: Temporary LinkedIn Format

on:
  push:
    branches: [feat/linkedin-confirmed-publish]
    paths:
      - '.github/workflows/temporary-linkedin-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/linkedin-confirmed-publish
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Prettier exact LinkedIn files
        run: bunx prettier --write src/components/studio/LinkedInPublishGate.tsx src/lib/linkedin-publish.functions.ts
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/studio/LinkedInPublishGate.tsx src/lib/linkedin-publish.functions.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style(linkedin): format confirmed publishing gate'
          git push origin HEAD:feat/linkedin-confirmed-publish
